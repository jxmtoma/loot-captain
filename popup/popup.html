<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loot Captain</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header>
      <div class="brand">
        <img class="brand-mark" src="../icons/icon48.png" alt="">
        <div>
          <h1>Loot Captain</h1>
          <p>EverQuest gear ledger</p>
        </div>
      </div>
    </header>

    <section class="setting-card">
      <label><span>Compare Characters</span><small>CHARACTER SELECT</small></label>
      <div id="compare-list" class="compare-list"></div>
      <small class="hint">Pick one or more characters to compare against.</small>
    </section>

    <section class="setting-card">
      <label for="layout-select"><span>Badge Layout</span><small>MULTI-COMPARE</small></label>
      <select id="layout-select">
        <option value="collapsed">Compact — best character, panel chips</option>
        <option value="expanded">Expanded — every character in the row</option>
      </select>
    </section>

    <section class="setting-card">
      <label for="formula-select"><span>Score Formula</span><small>INVENTORY</small></label>
      <select id="formula-select"></select>
    </section>

    <section class="actions">
      <button id="btn-options" class="btn">Manage Characters</button>
    </section>

    <footer>
      <span id="status"></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
